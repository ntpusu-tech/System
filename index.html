<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<base target="_top">
<title>學生會學校報廢二手物品領用登記系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans TC',sans-serif;background:#F8F6FC;color:#1F2A24}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:12px 48px;background:#fff;border-bottom:1px solid #DCD6E6}
.logo{font-weight:700;font-size:20px;color:#5B3FA6}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:8px;color:#1F2A24;text-decoration:none;font-size:15px}
nav a.on{background:#ECE7F8;color:#3F2A7A;font-weight:700}
.wrap{max-width:1200px;margin:0 auto;padding:40px 48px;box-sizing:border-box}
h1{margin:0 0 8px;font-size:32px}h2{font-size:18px}
.sub{margin:0 0 28px;color:#5A635D;font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:8px;border:1px solid #5B3FA6;background:#5B3FA6;color:#fff;font:700 15px 'Noto Sans TC',sans-serif;cursor:pointer}
.btn.ghost{background:#fff;color:#3F2A7A}.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:#fff;border:1px solid #DCD6E6;border-radius:12px}
.tag{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700}
.ok{background:#ECE7F8;color:#3F2A7A}.wait{background:#FBEBC8;color:#6B4A00}.done{background:#E8E8E4;color:#4A4F4B}
.fld{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:700}
.fld input,.fld select,.fld textarea,.search{min-height:44px;box-sizing:border-box;padding:10px 12px;border:1px solid #B3ACC4;border-radius:8px;font:400 15px 'Noto Sans TC',sans-serif;background:#fff;color:#1F2A24}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.meta{margin:4px 0 0;color:#5A635D;font-size:14px}
.form{padding:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.full{grid-column:1/-1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{font-size:13px;font-weight:700;color:#3F2A7A;padding:6px 0}
.day{min-height:44px;border-radius:8px;border:1px solid #B3ACC4;background:#fff;color:#1F2A24;font:400 15px 'Noto Sans TC',sans-serif;cursor:pointer}
.day:disabled{border-color:transparent;background:#F1EFF5;color:#6E6A7C;cursor:not-allowed}
.day.sel{background:#5B3FA6;color:#fff;border-color:#5B3FA6;font-weight:700}
.notice{border:2px solid #5B3FA6;background:#ECE7F8;border-radius:12px;padding:18px 20px;color:#3F2A7A}
.err{color:#9B1C1C;font-weight:700;font-size:15px;min-height:22px}
table{width:100%;border-collapse:collapse;font-size:15px}th{text-align:left;padding:14px 16px;background:#EEEAF5;font-size:14px}td{padding:14px 16px;border-top:1px solid #DCD6E6}
footer{padding:20px 48px;background:#ECE7F8;color:#3F2A7A;text-align:center;font-size:15px;font-weight:700;line-height:1.7}
</style>
</head>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const API = 'https://script.google.com/macros/s/AKfycbxw8BpVs7MpTaLnlm76MOm527PVk4QOPWj59K729wx-bd6j_O3VaBQ98HuIKF0iw07-/exec';   // 放在 Apps Script 內：保持空白。放在 GitHub Pages 等其他網站：貼上 Apps Script 網頁應用程式網址（結尾 /exec）
const call = (fn, ...a) => API
  ? fetch(API, { method: 'POST', body: JSON.stringify({ fn: fn, args: a }) }).then(r => r.json()).then(j => { if (j.err) throw new Error('api'); return j.r; })
  : new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...a));
const SLOTS = ['12:30~13:10', '17:00~18:00'], STS = ['待審核', '已核准', '已領走', '已拒絕', '已取消'];
const fmt = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const addD = (d, n) => new Date(d.getTime() + n * 864e5);
const S = { view: 'home', items: [], queue: [], token: null, rows: [], sel: '', date: '', cal: { y: new Date().getFullYear(), m: new Date().getMonth() }, q: '', blocked: [] };

function nav() {
  $('#nav').innerHTML = [['home','物品總覽'],['queue','登記狀況'],['apply','申請領用'],['admin','領用管理']].map(([k,t]) =>
    `<a href="#" data-go="${k}" class="${S.view === k ? 'on' : ''}">${t}${k === 'admin' ? '<span class="tag done" style="margin-left:8px">管理員</span>' : ''}</a>`).join('');
}
async function go(v) {
  S.view = v; nav(); $('#app').innerHTML = '<p class="sub">載入中…</p>';
  try {
    if (v === 'home' || v === 'apply') S.items = await call('getItems');
    if (v === 'apply') S.blocked = await call('getBlocked');
    if (v === 'queue') S.queue = await call('getQueue');
    if (v === 'admin' && S.token) await loadAdmin();
  } catch (e) { $('#app').innerHTML = '<p class="sub">載入失敗，請重新整理頁面。</p>'; return; }
  draw();
}
function draw() { ({ home: vHome, queue: vQueue, apply: vApply, admin: vAdmin })[S.view](); }

/* 物品總覽 */
function vHome() {
  $('#app').innerHTML = `<h1>物品總覽</h1><p class="sub">瀏覽可領用的二手物品，找到需要的就送出領用申請。</p>
  <input class="search" id="q" type="search" aria-label="搜尋物品" placeholder="搜尋物品名稱或類別" style="width:100%;max-width:420px;margin-bottom:24px" value="${esc(S.q)}"><div class="grid" id="list"></div>`;
  fill();
}
function fill() {
  const q = S.q.toLowerCase();
  const L = S.items.filter(i => !q || (i.name + i.cat).toLowerCase().includes(q));
  $('#list').innerHTML = L.map(i => `<article class="card" style="padding:16px"><span class="tag ${i.left ? 'ok' : 'done'}">${i.left ? '尚有 ' + i.left + ' 件' : '已額滿'}</span>
  <h2 style="margin:10px 0 0">${esc(i.name)}</h2><p class="meta">${esc(i.cat)}・${esc(i.cond)}・${esc(i.loc)}</p><p class="meta">${esc(i.desc)}</p>
  <p class="meta" style="color:#3F2A7A;font-weight:700">每位申請者上限 ${i.limit} 件</p>
  <button class="btn" style="width:100%;margin-top:14px" data-act="apply" data-id="${esc(i.id)}" ${i.left ? '' : 'disabled'}>申請領用</button></article>`).join('') || '<p class="sub">目前沒有符合的物品</p>';
}

/* 登記狀況 */
function vQueue() {
  $('#app').innerHTML = `<h1>登記狀況</h1><p class="sub">各物品目前的登記數量與先後順序，依送出申請的時間由早到晚排列。</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:20px">${S.queue.map(i => `<article class="card" style="padding:20px">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h2 style="margin:0;font-size:20px">${esc(i.name)}</h2><span class="tag ${i.left ? 'ok' : 'done'}">${i.left ? '尚有 ' + i.left + ' 件' : '額滿'}</span></div>
  <p class="meta" style="font-size:15px;margin:8px 0 14px">總數 ${i.total} 件・每位申請者上限 ${i.limit} 件・剩餘 ${i.left} 件</p>
  <div style="overflow-x:auto;border:1px solid #DCD6E6;border-radius:8px"><table><thead><tr><th>順位</th><th>申請單位</th><th>件數</th><th>登記時間</th></tr></thead><tbody>
  ${i.rows.map(r => `<tr><td>${r.rank}</td><td>${esc(r.unit)}</td><td>${esc(r.qty)}</td><td>${esc(r.time)}</td></tr>`).join('') || '<tr><td colspan="4" style="color:#5A635D">目前尚無登記</td></tr>'}
  </tbody></table></div></article>`).join('')}</div>`;
}

/* 申請領用 */
function vApply() {
  const opts = S.items.filter(i => i.left > 0);
  if (!opts.find(i => i.id === S.sel)) S.sel = opts[0] ? opts[0].id : '';
  $('#app').innerHTML = `<h1>申請領用</h1><p class="sub">領用以單位為單位申請，請填寫申請單位與聯絡資訊，審核結果會以 Email 或電話通知聯絡人。</p>
  <div class="card form">
  <label class="fld full">申請物品<select id="itemSel">${opts.map(i => `<option value="${esc(i.id)}" ${i.id === S.sel ? 'selected' : ''}>${esc(i.name)}（剩 ${i.left} 件）</option>`).join('')}</select></label>
  <h2 class="full" style="margin:0">申請單位</h2>
  <label class="fld">單位名稱<input id="unit" maxlength="100"></label><label class="fld">單位主管<input id="boss" maxlength="100"></label>
  <label class="fld">聯絡人<input id="contact" maxlength="100"></label><label class="fld">聯絡電話<input id="phone" type="tel" maxlength="20"></label>
  <label class="fld full">電子郵件<input id="email" type="email" maxlength="100"></label>
  <h2 class="full" style="margin:8px 0 0">領用內容</h2>
  <label class="fld">領用數量<input id="qty" type="number" min="1" value="1"><span id="limit" style="font-weight:400;font-size:13px;color:#5A635D"></span></label>
  <div class="full notice" style="font-size:15px;padding:14px 18px"><strong>領取方式：</strong>一律至學生會自行領取，不提供配送或搬運。</div>
  <section class="full"><h2 style="margin:0 0 12px">領取日期與時段</h2><div style="display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start">
  <div class="card" style="padding:16px;width:min(100%,344px);box-sizing:border-box" id="cal"></div>
  <div style="flex:1;min-width:220px;display:flex;flex-direction:column;gap:16px"><fieldset style="border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:12px;font-size:15px"><legend style="font-weight:700;margin-bottom:8px">方便領貨的時段</legend>
  ${SLOTS.map((s, k) => `<label><input type="radio" name="slot" value="${s}" ${k ? '' : 'checked'}> ${s}</label>`).join('')}</fieldset>
  <div class="card" style="padding:14px 18px;font-size:15px" id="picked"></div><p class="meta" style="margin:0">僅週一至週五、明天起 30 天內可選，灰色日期（含週末、國定假日、停課日）無法選取。領取地點為學生會。</p></div></div></section>
  <label class="fld full">使用用途<textarea id="purpose" rows="4" maxlength="200" placeholder="請說明物品會用在哪裡、由誰使用"></textarea></label>
  <div class="full notice"><strong style="font-size:17px">重要聲明</strong><p style="margin:6px 0 0;font-size:16px;font-weight:700;line-height:1.7">本系統與所有物品之領用規則、審核及爭議處理，最終解釋權歸學生會所有。</p></div>
  <fieldset class="full" style="border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:12px"><legend style="font-weight:700;font-size:15px;margin-bottom:8px">送出前請確認（兩項皆須勾選）</legend>
  <label style="display:flex;gap:10px;font-size:15px"><input id="a1" type="checkbox" style="margin-top:4px;width:18px;height:18px"> 本單位主管已同意此次領用，領取後自行負責保管與使用。</label>
  <label style="display:flex;gap:10px;font-size:15px"><input id="a2" type="checkbox" style="margin-top:4px;width:18px;height:18px"> 學生會不負修繕責任。</label></fieldset>
  <div class="full err" id="msg" role="alert"></div><div class="full"><button class="btn" id="sub" data-act="submit">送出申請</button></div></div>`;
  S.date = ''; calDraw(); limitHint();
}
function limitHint() { const i = S.items.find(x => x.id === $('#itemSel').value); if (i) { $('#limit').textContent = '本物品每位申請者上限 ' + i.limit + ' 件，超過將無法送出'; $('#qty').max = Math.min(i.limit, i.left); } }
function calDraw() {
  const c = S.cal, off = (new Date(c.y, c.m, 1).getDay() + 6) % 7, n = new Date(c.y, c.m + 1, 0).getDate(), t = new Date(), min = fmt(addD(t, 1)), max = fmt(addD(t, 30)), B = {};
  (S.blocked || []).forEach(b => B[b.date] = b.note || '休館');
  let cells = '<div></div>'.repeat(off);
  for (let d = 1; d <= n; d++) {
    const dt = new Date(c.y, c.m, d), s = fmt(dt), w = dt.getDay(), ok = w > 0 && w < 6 && s >= min && s <= max && !B[s];
    cells += ok ? `<button type="button" class="day${S.date === s ? ' sel' : ''}" data-date="${s}" aria-pressed="${S.date === s}">${d}</button>` : `<button type="button" class="day" disabled${B[s] ? ' title="不開放：' + esc(B[s]) + '" aria-label="' + d + ' 日不開放（' + esc(B[s]) + '）"' : ''}>${d}</button>`;
  }
  $('#cal').innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><button type="button" class="btn ghost" style="padding:0;width:44px" data-cal="-1" aria-label="上個月">‹</button><strong>${c.y} 年 ${c.m + 1} 月</strong><button type="button" class="btn ghost" style="padding:0;width:44px" data-cal="1" aria-label="下個月">›</button></div>
  <div class="cal">${['一','二','三','四','五','六','日'].map(w => `<div class="wd">${w}</div>`).join('')}${cells}</div>`;
  $('#picked').innerHTML = '<strong>已選擇：</strong>' + (S.date ? esc(S.date) : '尚未選擇日期');
}
async function submit() {
  const v = id => $('#' + id).value.trim(), msg = t => $('#msg').textContent = t;
  const f = { itemId: $('#itemSel').value, unit: v('unit'), boss: v('boss'), contact: v('contact'), phone: v('phone'), email: v('email'), qty: Number($('#qty').value),
    date: S.date, slot: (document.querySelector('input[name=slot]:checked') || {}).value || '', purpose: v('purpose'), agree1: $('#a1').checked, agree2: $('#a2').checked };
  if (!f.date) return msg('請在日曆選擇領取日期');
  msg(''); const b = $('#sub'); b.disabled = true;
  const r = await call('submitApplication', f).catch(() => ({ ok: false, msg: '連線失敗，請稍後再試' }));
  b.disabled = false;
  if (!r.ok) return msg(r.msg);
  $('#app').innerHTML = `<h1>申請已送出</h1><div class="card" style="padding:28px;max-width:560px"><p style="font-size:16px;line-height:1.8">您的申請編號是 <strong>${esc(r.id)}</strong>，目前狀態為「待審核」。<br>審核通過後，請在所選時段到學生會領取，並請保留此編號。<br>系統已寄出確認信到您填寫的 Email，沒收到請檢查垃圾郵件。</p><button class="btn" data-go="queue">查看登記狀況</button></div>`;
}

/* 領用管理（管理員） */
async function loadAdmin() {
  const r = await call('adminList', S.token);
  if (!r.ok) { S.token = null; S.err = r.msg; return; }
  S.rows = r.rows;
}
function vAdmin() {
  if (!S.token) {
    $('#app').innerHTML = `<div class="card" style="max-width:420px;margin:24px auto;padding:32px;display:flex;flex-direction:column;gap:20px"><h1 style="font-size:26px;margin:0">後台登入</h1>
    <p class="meta" style="font-size:15px;margin:0">僅限後台管理員名單內的帳號登入。</p><label class="fld">帳號<input id="u" autocomplete="username"></label>
    <label class="fld">密碼<input id="p" type="password" autocomplete="current-password"></label><div class="err" id="msg" role="alert">${esc(S.err || '')}</div><button class="btn" id="lg" data-act="login">登入</button></div>`;
    S.err = ''; return;
  }
  $('#app').innerHTML = `<h1>領用管理</h1><p class="sub">審核領用申請，並記錄物品交付狀態。</p><div class="err" id="msg" role="alert"></div>
  <div class="card" style="overflow-x:auto"><table style="min-width:980px"><thead><tr><th>編號</th><th>物品</th><th>數量</th><th>單位／聯絡人</th><th>聯絡方式</th><th>領取時段</th><th>狀態</th><th>操作</th></tr></thead><tbody>
  ${S.rows.slice().reverse().map(r => `<tr><td>${esc(r.id)}<br><span class="meta">${esc(r.time)}</span></td><td>${esc(r.item)}</td><td>${esc(r.qty)}</td><td>${esc(r.unit)}<br><span class="meta">${esc(r.contact)}（主管：${esc(r.boss)}）</span></td>
  <td>${esc(r.phone)}<br><span class="meta">${esc(r.email)}</span></td><td>${esc(r.date)}<br>${esc(r.slot)}</td><td><span class="tag ${r.status === '待審核' ? 'wait' : r.status === '已核准' ? 'ok' : 'done'}">${esc(r.status)}</span></td>
  <td><select data-st="${esc(r.id)}" aria-label="變更狀態">${STS.map(s => `<option ${s === r.status ? 'selected' : ''}>${s}</option>`).join('')}</select> <button class="btn ghost" style="min-height:44px" data-act="setst" data-id="${esc(r.id)}">更新</button></td></tr>`).join('')}
  </tbody></table></div><p style="margin-top:16px"><button class="btn ghost" data-act="logout">登出</button></p>`;
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-go],[data-act],[data-date],[data-cal]'); if (!t) return;
  if (t.dataset.go) { e.preventDefault(); return go(t.dataset.go); }
  if (t.dataset.date) { S.date = t.dataset.date; return calDraw(); }
  if (t.dataset.cal) { S.cal.m += Number(t.dataset.cal); if (S.cal.m < 0) { S.cal.m = 11; S.cal.y--; } if (S.cal.m > 11) { S.cal.m = 0; S.cal.y++; } return calDraw(); }
  const a = t.dataset.act;
  if (a === 'apply') { S.sel = t.dataset.id; return go('apply'); }
  if (a === 'submit') return submit();
  if (a === 'logout') { S.token = null; return draw(); }
  if (a === 'login') {
    t.disabled = true;
    const r = await call('adminLogin', $('#u').value, $('#p').value).catch(() => ({ ok: false, msg: '連線失敗，請稍後再試' }));
    if (!r.ok) { t.disabled = false; return $('#msg').textContent = r.msg; }
    S.token = r.token; return go('admin');
  }
  if (a === 'setst') {
    const id = t.dataset.id, st = document.querySelector(`[data-st="${CSS.escape(id)}"]`).value;
    t.disabled = true;
    const r = await call('adminSetStatus', S.token, id, st).catch(() => ({ ok: false, msg: '連線失敗，請稍後再試' }));
    if (!r.ok) { t.disabled = false; if (/過期/.test(r.msg)) { S.token = null; S.err = r.msg; return draw(); } return $('#msg').textContent = r.msg; }
    return go('admin');
  }
});
document.addEventListener('change', e => { if (e.target.id === 'itemSel') { S.sel = e.target.value; limitHint(); } });
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; fill(); } });
go('home');
</script>
</body>
</html>
